<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        div {
            width: 300px;
            border: 5px solid black;   /* Border */
            padding: 20px;             /* Space inside border */
            margin: 30px;              /* Space outside border */
            background-color: lightyellow;
        }
    </style>

</head>

<body>

    <h2>CSS Box Model Example</h2>

    <div>
        This is a box model example showing content, padding, border, and margin.
    </div>

</body>
</html>
