<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element Selector */
        p {
            color: blue;
        }

        /* Class Selector */
        .text {
            color: green;
        }

        /* ID Selector */
        #heading {
            color: red;
        }

        /* Group Selector */
        h2, h3 {
            color: purple;
        }

        /* Universal Selector */
        * {
            font-family: Arial;
        }
    </style>

</head>

<body>

    <h1 id="heading">ID Selector Example</h1>

    <p>Element Selector Example</p>

    <p class="text">Class Selector Example</p>

    <h2>Group Selector Example</h2>
    <h3>Group Selector Example</h3>

</body>
</html>
