<!DOCTYPE html>
<html>
<head>
    <title>CSS Example</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: red;
            text-align: center;
        }

        p {
            color: green;
            font-size: 18px;
        }

</head>

<body>

    <h1>Welcome to CSS</h1>
    <p>This is a paragraph styled using CSS.</p>

</body>
</html>
