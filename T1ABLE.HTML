<!DOCTYPE html>
<html>
<head>
    <title>Table Example</title>
</head>

<body>

    <h2>Student Table</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Diana</td>
            <td>20</td>
            <td>BCA</td>
        </tr>

        <tr>
            <td>Ram</td>
            <td>21</td>
            <td>BBA</td>
        </tr>
    </table>

</body>
</html>
