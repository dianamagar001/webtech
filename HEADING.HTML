<!DOCTYPE html>
<html>
<head>
    <title>List Elements</title>
</head>

<body>

    <h2>Ordered List</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Tea</li>
        <li>Coffee</li>
        <li>Juice</li>
    </ul>

    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>

        <dt>CSS</dt>
        <dd>Used for styling web pages</dd>
    </dl>

</body>
</html>
