<!DOCTYPE html>
<html>
<head>
    <title>CSS Font Properties</title>

    <style>
        p {
            font-family: Arial;      /* Font type */
            font-size: 20px;         /* Font size */
            font-style: italic;      /* Italic text */
            font-weight: bold;       /* Bold text */
            color: blue;             /* Text color */
        }
    </style>

</head>

<body>

    <h2>Font Properties Example</h2>

    <p>This text is styled using CSS font properties.</p>

</body>
</html>
